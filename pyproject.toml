[project]
name = "ctxb"
version = "0.1.0"
description = "Challenge B: context management — compaction (B1) và Code Mode (B2) với Gemini"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "pandas>=2.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
